name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Generated API client is up to date (contract guardrail)
        run: |
          npm run generate:api
          git diff --exit-code src/api/client/schema.d.ts

      - name: Type check
        run: npm run typecheck

      # The floor is `coverage.thresholds` in vite.config.ts (14 P5-E): it only goes up.
      - name: Tests (Vitest) + coverage floor
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle budget (12 D13)
        run: npm run bundle:report >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency audit
        run: npm audit --audit-level=high

  # Shared, reusable cross-repo gates hosted in apichain-backend (05 §6.2
  # guardrail 4): the secret scan and the image build + Trivy scan run
  # byte-identical logic in both repos. `scan-image` needs the backend's P5-E
  # quality-gates.yml on main, so the backend PR merges first.
  shared:
    uses: Apichain-Kenya/apichain-backend/.github/workflows/quality-gates.yml@main
    with:
      scan-image: true
