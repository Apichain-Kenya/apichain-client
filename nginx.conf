# The PWA is client-routed: a jar QR opens /v/<public_id>, which is no file.
# Every unknown path serves the shell (App Platform does the same with
# catchall_document). /v2 must be routed to the API on the same host (12 D4).
server {
  listen 80;
  root /usr/share/nginx/html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  # A built chunk that is gone (a page on the previous deploy asking for it)
  # is a 404, never the HTML shell: served as HTML it fails as a module with a
  # MIME error instead of a plain "not found".
  location /assets/ {
    try_files $uri =404;
  }
  # The service worker must always be revalidated, or updates stall.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
}
